version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Taipei
    open-pull-requests-limit: 10
    groups:
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-patches:
        dependency-type: production
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Taipei
    groups:
      actions:
        patterns:
          - '*'
