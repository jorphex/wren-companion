version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Taipei
    open-pull-requests-limit: 10
    ignore:
      # Babel 8 needs a coordinated compiler, preset, plugin, and runtime migration.
      - dependency-name: '@babel/core'
        update-types:
          - version-update:semver-major
      - dependency-name: '@babel/plugin-transform-runtime'
        update-types:
          - version-update:semver-major
      - dependency-name: '@babel/preset-env'
        update-types:
          - version-update:semver-major
      - dependency-name: '@babel/preset-react'
        update-types:
          - version-update:semver-major
      - dependency-name: '@babel/runtime'
        update-types:
          - version-update:semver-major
    groups:
      react:
        patterns:
          - react
          - react-dom
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-patches:
        dependency-type: production
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Taipei
    groups:
      actions:
        patterns:
          - '*'
