name: Companion quality and package checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test and package Chrome and Firefox
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm install --global npm@11.12.0
      - run: npm run setup:ci
      - run: npm run audit:release
      - uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: 151.0.7922.77
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: 153.0.3
      - name: Qualify isolated Chrome and Firefox extensions
        run: npm run qualify:browser
      - name: Install Firefox 151 document-identity compatibility boundary
        id: firefox-151
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: 151.0.4
      - name: Qualify Firefox missing-documentId fallback
        env:
          WREN_FIREFOX_BINARY: ${{ steps.firefox-151.outputs.firefox-path }}
          WREN_FIREFOX_REQUIRE_NONCE_FALLBACK: '1'
        run: npm run qualify:browser -- --browser=firefox
      - name: Verify release package prerequisites
        run: |
          command -v zip
          command -v unzip
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - run: npm run package:browsers
      - run: npm run package:verify
      - name: Upload qualified companion artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wren-companion-${{ github.sha }}
          path: |
            artifacts/*.zip
            artifacts/*-compatibility.json
            artifacts/*.cdx.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
